site_name: Poool Documentation
site_description: Formal Verification and Concurrent Physics Engine
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark theme

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light theme

nav:
  - Home: index.md
  - Analysis: analysis.md
  - Design: design.md
  - Behaviour: behaviour.md
  - Model Checking: model-checking.md
  - Performance Evaluation: performance-evaluation.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - print-site:            # must stay the last plugin
      add_to_navigation: false
      add_cover_page: true
      add_table_of_contents: true
      enumerate_headings: false
      print_page_title: "Poool Documentation"