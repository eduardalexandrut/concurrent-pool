name: Release on Breaking Change

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessario per analizzare la history dei commit

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Semantic Release Check & Bump
        uses: cycjimmy/semantic-release-action@v4
        id: semantic
        with:
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
          # Configuriamo semantic-release affinché generi una release SOLO se c'è un breaking change (major)
          # Regola: 2=Major/Breaking, 1=Minor, 0=Patch. Vogliamo rilasciare solo se level >= 2 (o se forziamo major).
          branches: |
            ['main']
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Questa parte compila la fat JAR e crea la release GitHub SOLO se il passo precedente ha effettivamente creato una nuova versione
      - name: Build Fat JAR and Upload to Release
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo "Nuova release rilevata: ${{ steps.semantic.outputs.new_release_version }}"
          
          # Compila il progetto e crea la fat-JAR tramite il maven-shade-plugin
          mvn clean package
          
          # Trova la fat JAR generata in target/ e caricala sulla release appena creata
          VERSION="${{ steps.semantic.outputs.new_release_version }}"
          JAR_FILE=$(ls target/*-shaded.jar 2>/dev/null || ls target/*.jar | grep -v "original")
          
          echo "Caricamento di $JAR_FILE sulla release $VERSION..."
          
          gh release upload "v$VERSION" "$JAR_FILE" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}