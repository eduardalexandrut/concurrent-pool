name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/make_pdf.py'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:          # allows running it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install MkDocs, plugins and headless Chromium
        run: |
          pip install mkdocs-material mkdocs-print-site-plugin playwright
          python -m playwright install --with-deps chromium

      - name: Build MkDocs
        run: mkdocs build

      # print_page/ contains all the chapters on one page; Chromium renders the Mermaid diagrams
      # and prints it, so the PDF ends up inside the site next to index.html
      - name: Build PDF
        run: python scripts/make_pdf.py site site/poool-documentation.pdf

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: poool-documentation
          path: site/poool-documentation.pdf

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4